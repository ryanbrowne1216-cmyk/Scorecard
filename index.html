<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
}

.player {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: auto;
}

video {
    width: 100%;
    display: block;
}

.scorecard {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(0,0,0,.85);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
}

.teams {
    font-size: 15px;
}

.score {
    font-size: 24px;
    margin-top: 3px;
}

.status {
    color: #00ff66;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="player">

    <video id="video" controls autoplay muted></video>

    <div class="scorecard">
        <div class="status">● LIVE 67'</div>
        <div class="teams">India &nbsp; vs &nbsp; Brazil</div>
        <div class="score">2 - 1</div>
    </div>

</div>

<script>
const video = document.getElementById('video');

const stream =
"http://10.98.233.37:8080/live/news/hls.m3u8";

if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(stream);
    hls.attachMedia(video);

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src = stream;

}
</script>

</body>
</html>
